version: "3.8"
services:
  app:
    build:
      context: ../../
      dockerfile: ops-tools/docker/images/app/Dockerfile
    container_name: my-app
    ports:
      - "8888:8888"
    depends_on:
      - postgres
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/school
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=school
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    networks:
      - docker-practice-net
